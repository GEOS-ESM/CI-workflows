name: GEOS-ESM Fixture Build Tests

on:
  workflow_call:
    inputs:
      compiler:
        description: 'Compiler to use (ifort, ifx, gfortran-14, gfortran-15)'
        required: false
        type: string
        default: 'ifort'

      cmake-build-type:
        description: 'CMake build type'
        required: false
        type: string
        default: 'Debug'

      baselibs-version:
        description: 'Container version to use (e.g., v8.27.0, v9.7.1)'
        required: false
        type: string
        default: 'v8.27.0'

      fixture-repo:
        description: 'Repository to checkout (e.g., GEOS-ESM/GEOSgcm). If not provided, uses current repo'
        required: false
        type: string
        default: ''

      fixture-ref:
        description: 'Repository ref/branch to checkout (only used when fixture-repo is provided)'
        required: false
        type: string
        default: ''

      run-mepo-develop:
        description: 'Whether to run mepo develop step'
        required: false
        type: boolean
        default: true

      build-jobs:
        description: 'Number of parallel build jobs'
        required: false
        type: number
        default: 4

      build-target:
        description: "Target for CMake to build"
        required: false
        type: string
        default: ''

      run-gocart-tests:
        description: 'Whether to run gocart tests'
        required: false
        type: boolean
        default: false

      bcs-version:
        description: 'BCS version to use when run-gocart-tests is true (e.g., v11.6.0)'
        required: false
        type: string
        default: 'v11.6.0'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      container-image: ${{ steps.config.outputs.container-image }}
      fortran-compiler: ${{ steps.config.outputs.fortran-compiler }}
      version-command: ${{ steps.config.outputs.version-command }}
      repo-name: ${{ steps.config.outputs.repo-name }}
    steps:
      - name: Configure compiler settings
        id: config
        run: |
          VERSION="${{ inputs.baselibs-version }}"
          BCS_VERSION="${{ inputs.bcs-version }}"
          USE_BCS="${{ inputs.run-gocart-tests }}"
          case "${{ inputs.compiler }}" in
            "ifort")
              if [[ "${USE_BCS}" == "true" ]]; then
                echo "container-image=gmao/ubuntu24-geos-env-bcs:${VERSION}-intelmpi_2021.13-ifort_2021.13-bcs_${BCS_VERSION}" >> $GITHUB_OUTPUT
              else
                echo "container-image=gmao/ubuntu24-geos-env:${VERSION}-intelmpi_2021.13-ifort_2021.13" >> $GITHUB_OUTPUT
              fi
              echo "fortran-compiler=ifort" >> $GITHUB_OUTPUT
              echo "version-command=ifort --version" >> $GITHUB_OUTPUT
              ;;
            "ifx")
              if [[ "${USE_BCS}" == "true" ]]; then
                echo "container-image=gmao/ubuntu24-geos-env-bcs:${VERSION}-intelmpi_2021.17-ifx_2025.3-bcs_${BCS_VERSION}" >> $GITHUB_OUTPUT
              else
                echo "container-image=gmao/ubuntu24-geos-env:${VERSION}-intelmpi_2021.17-ifx_2025.3" >> $GITHUB_OUTPUT
              fi
              echo "fortran-compiler=ifx" >> $GITHUB_OUTPUT
              echo "version-command=ifx --version" >> $GITHUB_OUTPUT
              ;;
            "gfortran-14")
              if [[ "${USE_BCS}" == "true" ]]; then
                echo "container-image=gmao/ubuntu24-geos-env-bcs:${VERSION}-openmpi_5.0.5-gcc_14.2.0-bcs_${BCS_VERSION}" >> $GITHUB_OUTPUT
              else
                echo "container-image=gmao/ubuntu24-geos-env-mkl:${VERSION}-openmpi_5.0.5-gcc_14.2.0" >> $GITHUB_OUTPUT
              fi
              echo "fortran-compiler=gfortran" >> $GITHUB_OUTPUT
              echo "version-command=gfortran --version" >> $GITHUB_OUTPUT
              ;;
            "gfortran-15")
              if [[ "${USE_BCS}" == "true" ]]; then
                echo "container-image=gmao/ubuntu24-geos-env-bcs:${VERSION}-openmpi_5.0.5-gcc_15.2.0-bcs_${BCS_VERSION}" >> $GITHUB_OUTPUT
              else
                echo "container-image=gmao/ubuntu24-geos-env-mkl:${VERSION}-openmpi_5.0.5-gcc_15.2.0" >> $GITHUB_OUTPUT
              fi
              echo "fortran-compiler=gfortran" >> $GITHUB_OUTPUT
              echo "version-command=gfortran --version" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unsupported compiler: ${{ inputs.compiler }}"
              exit 1
              ;;
          esac
      - name: Extract repository name
        id: repo-name
        run: |
          if [[ -n "${{ inputs.fixture-repo }}" ]]; then
            # Extract repo name from fixture-repo (e.g., GEOS-ESM/GEOSldas -> GEOSldas)
            REPO_NAME=$(basename "${{ inputs.fixture-repo }}")
          else
            # Fall back to current repository name
            REPO_NAME=$(basename "${{ github.repository }}")
          fi
          echo "repo-name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "Using repository name: ${REPO_NAME}"

  build_fixture:
    name: Build ${{ inputs.fixture-repo || github.repository }} (${{ inputs.compiler }})
    needs: setup
    if: "!contains(github.event.pull_request.labels.*.name, '0 diff trivial')"
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.setup.outputs.container-image }}

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      OMPI_MCA_btl_vader_single_copy_mechanism: none

    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout GCM
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          repository: ${{ inputs.fixture-repo || null }}
          ref: ${{ inputs.fixture-ref || null }}

      - name: Set all directories as git safe
        run: |
          git config --global --add safe.directory '*'

      - name: Versions etc.
        run: |
          ${{ needs.setup.outputs.version-command }}
          mpirun --version
          echo $BASEDIR

      - name: Try matching branch in ${{ needs.setup.outputs.repo-name }} fixture
        if: ${{ github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'develop' }}
        run: |
          BRANCH="${GITHUB_HEAD_REF}"
          # Fetch the branch if it exists
          if git fetch origin "$BRANCH" 2>/dev/null; then
            echo "✓ Found matching branch '$BRANCH' in ${{ needs.setup.outputs.repo-name }} fixture"
            git checkout "$BRANCH"
          else
            echo "ℹ No matching branch '$BRANCH' in ${{ needs.setup.outputs.repo-name }} fixture, using default branch"
          fi
          git branch

      - name: Mepo clone external repos
        run: |
          mepo clone --partial blobless
          mepo status

      - name: Mepo develop usual suspects
        if: ${{ inputs.run-mepo-develop }}
        run: |
          mepo develop GEOSgcm_GridComp GEOSgcm_App GMAO_Shared GEOS_Util
          mepo status

      - name: Debug PR branch
        run: echo "PR is coming from ${{ github.event.pull_request.head.ref }}"

      - name: Update other branches
        if: ${{ github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'develop' }}
        run: |
          mepo checkout-if-exists ${GITHUB_HEAD_REF}
          mepo status

      - name: CMake
        run: |
          cmake -B build -S . --install-prefix=$PWD/install \
            -DCMAKE_Fortran_COMPILER=${{ needs.setup.outputs.fortran-compiler }} \
            -DCMAKE_BUILD_TYPE=${{ inputs.cmake-build-type }} \
            -DMPIEXEC_PREFLAGS='--oversubscribe' \
            -DUSE_F2PY=OFF

      - name: Build
        run: |
          cmake --build build -j ${{ inputs.build-jobs }} ${{ inputs.build-target }}

      # NOTE: The install step is disabled because GitHub Actions runners have limited
      # disk space (~14 GB). Running cmake --install after a large build effectively
      # doubles disk usage and causes "No space left on device" failures. Instead,
      # we run tests directly from the build directory.
      #- name: Install
      #  run: |
      #    cmake --install build

      # These are optional tests for MAPL3. For now, these run
      # inside the build directory
      - name: Run GOCART tests
        if: ${{ inputs.run-gocart-tests }}
        run: |
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+${LD_LIBRARY_PATH}:}$PWD/build/lib"
          mkdir gocart-tests && cd gocart-tests
          ln -s ../src/Components/@GEOSgcm_GridComp/GEOSagcm_GridComp/GEOSphysics_GridComp/@GEOSchem_GridComp/@GOCART/ESMF/GOCART2G_GridComp/GOCART2G_GridComp.yaml
          ln -s ../src/Components/@GEOSgcm_GridComp/GEOSagcm_GridComp/GEOSphysics_GridComp/@GEOSchem_GridComp/@GOCART/ESMF/GOCART2G_GridComp/SS2G_GridComp/SS2G_instance_SS.yaml SS_instance_SS.yaml
          ln -s ../src/Components/@GEOSgcm_GridComp/GEOSagcm_GridComp/GEOSphysics_GridComp/@GEOSchem_GridComp/@GOCART/ESMF/GOCART2G_GridComp/DU2G_GridComp/DU2G_instance_DU.yaml DU_instance_DU.yaml
          ln -s /TinyBCs-GitV10/gocart-ci-run/cap_restart.yaml
          ln -s /TinyBCs-GitV10/gocart-ci-run/cap.yaml
          ln -s /TinyBCs-GitV10/gocart-ci-run/fake-parent.yaml
          ln -s /TinyBCs-GitV10/gocart-ci-run/ExtData .
          cp -r /TinyBCs-GitV10/gocart-ci-run/checkpoints .
          mpirun -np 6 ../build/bin/GEOS.x cap.yaml

